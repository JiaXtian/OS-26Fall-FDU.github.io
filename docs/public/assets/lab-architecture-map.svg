<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="732" viewBox="0 0 1040 732" role="img" aria-labelledby="title desc">
<title id="title">实验与操作系统组件的对应关系</title><desc id="desc">按系统功能归类 Lab0 至 LabFinal：Lab0 对应启动，Lab1 对应分配器，Lab2 对应内核进程，Lab3 对应用户态页表和上下文，Lab4 对应 VirtIO 驱动及独立的宿主条件变量练习，Lab5 对应块缓存和日志，Lab6 对应 Inode 文件系统，LabFinal 完成应用支持、通信及系统集成。</desc>
