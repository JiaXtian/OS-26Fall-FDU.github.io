<rect x="60" y="565" width="852" height="52" rx="3" fill="white" stroke="#8b9aa6" stroke-width="1.3"/>
<text x="486" y="598" font-size="21" font-weight="600" text-anchor="middle" class="">设备驱动：VirtIO 块设备 · UART 串口</text>
