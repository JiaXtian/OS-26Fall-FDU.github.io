<text x="505" y="666" font-size="18" font-weight="400" text-anchor="start" class="muted">设备访问</text>
<path d="M 169 641 V 683" fill="none" stroke="#536575" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="152" y="666" font-size="17" font-weight="400" text-anchor="middle" class="muted">处理器 / 内存操作</text>
<rect x="36" y="686" width="968" height="81" rx="3" fill="#f7f9fb" stroke="#8b9aa6" stroke-width="1.3"/>
<text x="56" y="714" font-size="19" font-weight="600" text-anchor="start" class="accent">QEMU 模拟硬件</text>
<text x="520" y="747" font-size="22" font-weight="400" text-anchor="middle" class="">CPU / MMU     ·     内存     ·     块设备     ·     UART / 定时器</text>
<path d="M 972 686 V 301 H 913" fill="none" stroke="#536575" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="984" y="421" font-size="18" font-weight="400" text-anchor="start" class="muted">中</text>
<text x="984" y="446" font-size="18" font-weight="400" text-anchor="start" class="muted">断</text>
<text x="36" y="795" font-size="17" font-weight="400" text-anchor="start" class="muted">逻辑组件及主要交互；内核模块之间存在协作，未逐一绘出调用关系。</text>
