<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="868" viewBox="0 0 1180 868" role="img" aria-labelledby="title desc">
<title id="title">教学操作系统架构与主要访问路径</title>
<desc id="desc">EL0 用户程序通过系统调用或同步异常进入 EL1 内核。内核入口分派到进程、地址空间与文件接口。文件描述符指向 Inode 或 Pipe，设备 Inode 连接 Console；普通文件经块缓存与日志、VirtIO 访问磁盘。Console 经 UART 驱动访问终端设备。同步原语横跨内核。设备和定时器的中断进入统一异常入口。实线表示主要调用或访问路径，虚线表示中断；不表示完整调用图，省略返回路径与模块间的其他协作。</desc>
<rect width="1180" height="868" fill="#fff"/>
<style>text{font-family:"Noto Sans CJK SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#1d2935;font-size:23px} .section{font-size:19px;fill:#586978;letter-spacing:1px} .note{font-size:18px;fill:#586978} .accent{fill:#315975}</style>
