<text x="595.0" y="418" font-size="19" font-weight="400" text-anchor="middle" class="">Inode 与目录</text>
<text x="595.0" y="450" font-size="19" font-weight="400" text-anchor="middle" class="">块缓存与日志</text>
<rect x="714" y="345" width="198" height="134" rx="3" fill="#f7f9fb" stroke="#8b9aa6" stroke-width="1.3"/>
